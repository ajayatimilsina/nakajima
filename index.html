@media(prefers-color-scheme:dark){:root{--bg:#14191d;--card:#1e262c;--tx:#eceae4;--mut:#9aa6ae;--ac:#5bb5d6;--bd:#33404a;--ok:#5fc283}}
*{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--card);border-bottom:1px solid var(--bd);padding:14px max(16px,calc((100vw - 980px)/2))}
header b{font-size:18px}main{max-width:980px;margin:auto;padding:14px}
button,select,input{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:8px 10px}
button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.primary{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:5px 0;flex-wrap:wrap}.fields{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.field{display:flex;align-items:center;gap:6px}.muted{color:var(--mut)}.section{margin-top:18px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:10px}
.item,.panel{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px}.item h3{margin:0 0 5px;font-size:16px}.price{color:var(--mut)}.qty{display:flex;align-items:center;gap:12px;margin-top:10px}.qty button{min-width:40px;font-size:19px}
.tag{display:inline-block;background:var(--ac);color:white;border-radius:99px;padding:2px 8px;font-size:12px}.preparing{background:#bd7917}.served{background:var(--ok)}
.summary{position:sticky;bottom:0;margin:14px 0 0;padding:12px;background:var(--card);border:1px solid var(--bd);border-radius:8px;box-shadow:0 -4px 18px #0001}
label{line-height:1.4}input[type=number]{width:100px}.orders{display:grid;gap:6px}.order{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--bd)}
.catnav{position:sticky;top:0;z-index:5;display:flex;gap:6px;overflow-x:auto;padding:8px 14px;margin:-14px -14px 10px;background:var(--card);border-bottom:1px solid var(--bd);-webkit-overflow-scrolling:touch}
.catnav button{flex:0 0 auto;white-space:nowrap;border-radius:99px;padding:7px 14px}
@media(max-width:520px){header{padding:12px 14px}main{padding:12px}.catnav{margin:-12px -12px 10px}.fields{align-items:stretch}.field{justify-content:space-between;width:100%}.field select{max-width:60%}.item{padding:10px}}
</style>

 ${counterCalls.length?`<section role="alert" class="section panel" style="background:#fff3cd;color:#6b4e00;border:2px solid #e0a030"><b>カウンターへお越しください</b>${counterCalls.map(order=>`<div>スタッフからの呼び出し（注文 #${order.id}） <button type="button" onclick="speakCounterCall(${order.table})">音声でもう一度聞く</button></div>`).join('')}</section>`:''}
 ${syncMessage?`<p role="alert" class="muted">${esc(syncMessage)}</p>`:''}
 ${mine.length?`<section class="section panel"><b>注文履歴</b><div class="orders">${mine.map(order=>`<div class="order"><div><b>注文 #${order.id}</b><div class="muted">${order.items.map(item=>`${esc(item.n)} × ${remainingQty(item)}${cancelledQty(item)?`（${cancelledQty(item)}個取消済み）`:''}`).join(', ')}</div><div class="muted">${new Date(order.t).toLocaleTimeString()} · ${yen(order.items.reduce((sum,item)=>sum+item.p*remainingQty(item),0))}</div>${order.callCustomerAt?'<div role="alert" style="margin-top:6px;padding:8px;background:#fff3cd;color:#6b4e00;border-radius:6px;font-weight:bold">お客様をカウンターへお越しください</div>':''}</div><span class="tag ${order.status==='preparing'?'preparing':order.status==='served'?'served':''}">${order.status==='new'?'受付済み':order.status==='preparing'?'調理中':'提供済み'}</span>${order.status!=='served'?`<div class="muted" style="text-align:right;margin-top:4px">お届けまで <b class="timer" data-t="${order.t}"></b></div>`:''}</div>`).join('')}</div></section>`:''}
 ${mine.length?paymentPanel(mine):''}
 ${menuGroups().map(([category,items])=>`<section class="section" id="${catId(category)}" style="scroll-margin-top:64px"><h2 style="font-size:17px;margin:0 0 8px">${esc(category)}</h2>${items.length?'':'<p class="muted">準備中です。</p>'} <div class="grid">${items.map(item=>`<article class="item"${item.x?' style="opacity:.55"':''}><h3>${esc(item.n)}${item.x?' <span class="tag" style="background:#b3261e">欠品</span>':''}</h3>${item.d?`<div class="price">${esc(item.d)}</div>`:''}${item.id===15?`<label>内容<select onchange="setOtherPreset(this.value)"><option value="">選択してください</option>${MENU.filter(option=>option.cat==='定食').map(option=>`<option value="${option.id}" ${otherPreset==option.id?'selected':''}>${option.id} ${esc(option.n)} ${yen(option.p)}</option>`).join('')}</select></label><label style="display:block;margin-top:7px">料金（円）<input type="number" min="0" step="1" value="${otherPrice}" onchange="otherPrice=Math.max(0,Math.round(Number(this.value)||0));draw()"></label>`:item.id===16?`<label>内容<select onchange="setDrinkType(this.value)"><option value="0" ${otherDrinkType===0?'selected':''}>選択してください</option>${drinkTypes.map(option=>`<option value="${option.id}" ${otherDrinkType===option.id?'selected':''}>${option.n}</option>`).join('')}</select></label>${[5,6].includes(otherDrinkType)?`<label style="display:block;margin-top:7px">割り方<select onchange="otherDrinkOption=this.value;draw()"><option value="">選択してください</option>${shochuOptions.map(option=>`<option ${otherDrinkOption===option?'selected':''}>${option}</option>`).join('')}</select></label>`:''}<label style="display:block;margin-top:7px">料金（円）<input type="number" min="0" step="1" value="${otherDrinkPrice}" onchange="otherDrinkPrice=Math.max(0,Math.round(Number(this.value)||0));draw()"></label>`:`<div class="price">${yen(menuPrice(item))}${memberPricing?'（会員価格）':Number.isFinite(Number(item.memberPrice))?'（通常価格）':''}</div>`}${optionControls(item)}${item.id===7?`<label style="display:block;margin-top:7px">辛さ<select onchange="naanSpice=this.value;draw()"><option value="">選択</option>${[0,1,2].map(level=>`<option value="${level}" ${naanSpice==level?'selected':''}>${level}</option>`).join('')}</select></label>`:''}<div class="qty"><button aria-label="${esc(item.n)}を減らす" onclick="changeQty(${item.id},-1)">−</button><b>${cart[item.id]||0}</b><button aria-label="${esc(item.n)}を増やす" onclick="changeQty(${item.id},1)" ${item.x?'disabled':''}>+</button></div></article>`).join('')}</div></section>`).join('')}
 <section class="section panel"><label><input type="checkbox" ${receiptNeeded?'checked':''} onchange="receiptNeeded=this.checked;draw()"> 領収書が必要です</label>${receiptNeeded?`<label class="field" style="margin-top:8px">宛名<input id="receiptName" type="text" maxlength="60" value="${esc(receiptName)}" placeholder="お名前・会社名" oninput="receiptName=this.value" style="flex:1"></label>`:''}</section>
 <div class="summary row"><b>${count}点 · ${yen(total)} · ${people}名</b><button class="primary" ${count&&!orderPending?'':'disabled'} onclick="sendOrder()">${orderPending?'送信中…':'注文する'}</button></div>`;
 if(focusedName>=0){const input=document.getElementById('receiptName');if(input){input.focus();input.setSelectionRange(focusedName,focusedName)}}
}
function changeQty(id,delta){
 const item=MENU.find(entry=>entry.id===id);
 if(delta>0&&item&&item.x)return;
 cart[id]=Math.max(0,(cart[id]||0)+delta);
 let left=cart[id];
 if(item)itemOptions(item).forEach((option,i)=>{const key=id+':'+i;optQty[key]=Math.min(optQty[key]||0,left);left-=optQty[key]});
 draw();
}
function setOtherPreset(id){const item=MENU.find(entry=>entry.id===Number(id));otherPreset=item?String(item.id):'';otherName=item?item.n:'';otherPrice=item?item.p:100;draw()}
function setDrinkType(id){otherDrinkType=Number(id)||0;otherDrinkOption='';draw()}
async function sendOrder(){
 const items=MENU.filter(item=>cart[item.id]).flatMap(item=>{
  const chosen=itemOptions(item).map((option,i)=>({option,q:optQty[item.id+':'+i]||0})).filter(entry=>entry.q>0);
  const normal=cart[item.id]-chosen.reduce((sum,entry)=>sum+entry.q,0);
  const drink=drinkTypes.find(option=>option.id===otherDrinkType),price=item.id===15?otherPrice:item.id===16?otherDrinkPrice:menuPrice(item);
  const name=item.id===15?(otherName||item.n):item.id===16?`${drink?drink.n:item.n}${[5,6].includes(otherDrinkType)&&otherDrinkOption?`（${otherDrinkOption}）`:''}`:item.n;
  const spice=item.id===7&&naanSpice!==''?`（辛さ ${naanSpice}）`:'';
  return [normal>0?{n:name+spice,p:price,q:normal}:null,...chosen.map(entry=>({n:`${name}（${entry.option.n}）${spice}`,p:price+entry.option.p,q:entry.q}))].filter(Boolean);
 });
 if(!items.length)return;
 const soldOut=MENU.filter(item=>cart[item.id]&&item.x);
 if(soldOut.length){syncMessage=`欠品のため注文できません：${soldOut.map(item=>item.n).join('、')}`;draw();return}
 if(receiptNeeded&&!receiptName.trim()){syncMessage='領収書の宛名を入力してください。';draw();return}
 if(!window.firebaseSync){syncMessage='注文システムに接続できません。ページを再読み込みしてください。';draw();return}
 orderPending=true;syncMessage='';draw();
 try{
  await window.firebaseSync.createCustomerOrder({id:Date.now(),table,items,status:'new',paid:false,guestType,adultCount,  childCount,allergy,t:Date.now(),...(receiptNeeded?{receiptName:receiptName.trim()}:{})});
    cart={};optQty={};receiptNeeded=false;receiptName='';naanSpice='';otherPreset='';otherName='';otherPrice=100;otherDrinkType=0;otherDrinkOption='';otherDrinkPrice=0;
 }catch(error){syncMessage='注文を送信できませんでした。通信状態を確認してください。'}
 orderPending=false;draw();
}
function speakCounterCall(callTable){
 if(!('speechSynthesis' in window)){syncMessage='この端末は音声読み上げに対応していません。画面の案内をご確認ください。';draw();return}
 const utterance=new SpeechSynthesisUtterance(`テーブル${callTable}のお客様、カウンターまでお越しください。`);
 utterance.lang='ja-JP';
 const japaneseVoice=speechSynthesis.getVoices().find(voice=>voice.lang.toLowerCase().startsWith('ja'));
 if(japaneseVoice)utterance.voice=japaneseVoice;
 speechSynthesis.cancel();
 speechSynthesis.speak(utterance);
}
window.addEventListener('firebase-sync-ready',()=>window.firebaseSync.startCustomer(remoteOrders=>{
 const calls=remoteOrders.filter(order=>order.table===table&&!order.paid&&order.callCustomerAt);
 calls.forEach(order=>{
  const previous=announcedCalls.get(order.key)||0;
  if(order.callCustomerAt>previous){announcedCalls.set(order.key,order.callCustomerAt);speakCounterCall(order.table)}
 });
 orders=remoteOrders;draw()
}).catch(()=>{syncMessage='注文システムに接続できません。';draw()}),{once:true});
window.addEventListener('firebase-menu',event=>{
 if(Array.isArray(event.detail.menu)){
  const remote=event.detail.menu;
  const defaults=[...MENU,...DEFAULT_DRINKS,...DEFAULT_EXTRA_MENU];
  const remoteIds=new Set(remote.map(item=>item.id));
  MENU=[...remote.map(item=>{
   const fallback=defaults.find(entry=>entry.id===item.id);
   if(!fallback)return item;
   const existingOptions=item.o||[];
   const mergedOptions=fallback.o?[...existingOptions,...fallback.o.filter(option=>!existingOptions.some(current=>current.n===option.n))]:existingOptions;
   return {...item,...(mergedOptions.length?{o:mergedOptions}:{}),...(!item.d&&fallback.d?{d:fallback.d}:{})};
  }),...[...DEFAULT_DRINKS,...DEFAULT_EXTRA_MENU].filter(item=>!remoteIds.has(item.id))];
  MENU.filter(item=>item.x&&cart[item.id]).forEach(item=>{cart[item.id]=0;itemOptions(item).forEach((option,i)=>{optQty[item.id+':'+i]=0})});
  draw();
 }
});
window.addEventListener('firebase-sync-error',event=>{syncMessage=event.detail?.message||'データベースに接続できません。';draw()});
function tick(){
 document.querySelectorAll('.timer').forEach(el=>{
  const left=Number(el.dataset.t)+20*60000-Date.now();
  el.textContent=left>0?`${String(Math.floor(left/60000)).padStart(2,'0')}:${String(Math.floor(left/1000)%60).padStart(2,'0')}`:'まもなく';
 });
}
setInterval(tick,1000);
const baseDraw=draw;
draw=function(){baseDraw();tick()};
const match=location.hash.match(/t=(\d+)/);if(match)table=Math.min(40,Math.max(1,Number(match[1])));draw();
</script>
</body>
</html>
