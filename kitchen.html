<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>あじまるや | 厨房ディスプレイ</title>
<style>
:root{box-sizing:border-box;--bg:#14191d;--card:#1e262c;--tx:#eceae4;--mut:#9aa6ae;--ac:#5bb5d6;--bd:#33404a;--ok:#5fc283;--warn:#e0a030}
*{box-sizing:inherit}body{margin:0;background:var(--bg);color:var(--tx);font:18px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:12px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--bd)}
header b{font-size:20px}header a{color:var(--ac)}main{padding:14px}
button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:12px 16px;cursor:pointer}.primary{background:var(--ac);color:#102028;border-color:var(--ac);font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.card{background:var(--card);border:2px solid var(--bd);border-radius:10px;padding:12px}.card.new{border-color:var(--warn)}.card.preparing{border-color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}.muted{color:var(--mut);font-size:14px}.item{font-size:22px;font-weight:bold;margin:4px 0}
.tag{border-radius:99px;padding:2px 10px;font-size:13px;color:#102028;background:var(--warn)}.card.preparing .tag{background:var(--ac)}
.allergy{color:#ff8a80;font-weight:bold}.cancelled{text-decoration:line-through;color:var(--mut)}
</style>
</head>
<body>
<header><b>厨房ディスプレイ</b><a href="admin.html">お会計</a><a href="menu.html">メニュー管理</a><span id="auth"></span></header>
<main id="app"></main>
<script type="module" src="firebase-sync.js"></script>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cancelledQty=item=>Math.min(item.q,item.cancelled?item.q:Number(item.cancelledQty)||0);
const remainingQty=item=>Math.max(0,item.q-cancelledQty(item));
let orders=[],isStaff=false,message='',knownKeys=null,staffEmail='',connected=false,speechEnabled=false;
const speechQueue=new Map();
const scheduledSpeechKeys=new Set();
function beep(){try{const ctx=new (window.AudioContext||window.webkitAudioContext)(),osc=ctx.createOscillator();osc.connect(ctx.destination);osc.frequency.value=880;osc.start();osc.stop(ctx.currentTime+.25)}catch(error){}}
function speakText(text){
  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){
    message='この端末またはブラウザーは音声読み上げに対応していません。';
    render();
    return false;
  }
  const utterance=new SpeechSynthesisUtterance(text);
  utterance.lang='ja-JP';
  const japaneseVoice=speechSynthesis.getVoices().find(voice=>voice.lang.toLowerCase().startsWith('ja'));
  if(japaneseVoice)utterance.voice=japaneseVoice;
  utterance.onerror=event=>{
    if(event.error!=='canceled'&&event.error!=='interrupted'){
      message='音声を再生できませんでした。端末の音量とブラウザー設定を確認してください。';
      render();
    }
  };
  speechSynthesis.speak(utterance);
  return true;
}
function orderSpeechText(order){
  const items=order.items.filter(item=>remainingQty(item)>0).map(item=>`${item.n}、${remainingQty(item)}点`).join('。');
  return `新しい注文です。テーブル${order.table}。注文番号${order.id}。${items||'商品はありません。'}。${order.allergy==='あり'?'アレルギーがあります。':''}`;
}
function greetAloud(){speakText('ありがとうございました。いらっしゃいませ。')}
function scheduleOrderSpeech(order){
  if(scheduledSpeechKeys.has(order.key))return;
  scheduledSpeechKeys.add(order.key);
  if(speechEnabled)speakText(orderSpeechText(order));
  else speechQueue.set(order.key,order);
}
function toggleSpeech(){
  if(!('speechSynthesis' in window)||typeof SpeechSynthesisUtterance==='undefined'){
    message='この端末またはブラウザーは音声読み上げに対応していません。';
    render();
    return;
  }
  speechEnabled=!speechEnabled;
  if(speechEnabled){
    const queued=[...speechQueue.values()];
    speechQueue.clear();
    if(queued.length)queued.forEach(order=>speakText(orderSpeechText(order)));
    message='新しい注文を自動で1回読み上げます。';
  }else{
    speechSynthesis.cancel();
    message='注文の自動読み上げを停止しました。';
  }
  render();
}
function render(){
  const app=document.getElementById('app');
  document.getElementById('auth').innerHTML=isStaff?`<button onclick="firebaseSync.signOut()">ログアウト</button>`:'';
  if(!isStaff){app.innerHTML=`<p>スタッフ用Googleアカウントでログインしてください。</p><button class="primary" onclick="login()">Googleでログイン</button>${message?`<p role="alert">${esc(message)}</p>`:''}`;return}
  const active=orders.filter(order=>!order.paid&&order.status!=='served').sort((a,b)=>a.t-b.t);
  const status=`<p class="muted">ログイン中：${esc(staffEmail)} ・ 受信した注文：${orders.length}件${connected?'':' ・ ⚠ 接続待ち'}</p>`;
  app.innerHTML=`${status}<div class="row" style="margin:10px 0"><span>注文の自動読み上げ：${speechEnabled?'有効（新規注文ごとに1回）':'無効'}${speechQueue.size?` ・ 未読み上げ ${speechQueue.size}件`:''}</span><button onclick="toggleSpeech()">${speechEnabled?'自動読み上げを停止':'自動読み上げを有効化'}</button><button onclick="greetAloud()">「ありがとうございました。いらっしゃいませ。」</button></div>${message?`<p role="alert" style="color:#ff8a80">${esc(message)}</p>`:''}${active.length?`<div class="grid">${active.map(order=>{
    const time=new Date(order.t).toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'});
    return `<div class="card ${order.status==='preparing'?'preparing':'new'}"><div class="row"><b style="font-size:26px">Table ${order.table}</b><span class="tag">${order.status==='new'?'新規':'調理中'}</span></div>
    <div class="row"><span class="muted">#${order.id} · ${time} · 大人${order.adultCount} 子${order.childCount}</span><b class="timer" data-t="${order.t}" style="font-size:26px"></b></div>
    ${order.allergy==='あり'?'<div class="allergy">⚠ アレルギーあり</div>':''}
    <div style="margin:8px 0">${order.items.map((item,index)=>`<div class="item ${remainingQty(item)===0?'cancelled':''}">${esc(item.n)} × ${item.q}${cancelledQty(item)?`（${cancelledQty(item)}個取消済み）`:''}${remainingQty(item)>0?` <button style="padding:4px 8px;font-size:14px\" onclick=\"cancelItem('${order.key}',${index})\">1個取消</button>`:''}</div>`).join('')}</div>
    <div class="row">${order.status==='new'?`<button class="primary" onclick="setStatus('${order.key}','preparing')">調理開始</button>`:''}<button onclick="callCustomer('${order.key}')">お客様をカウンターへ呼び出す</button>${order.callCustomerAt?`<button onclick="acknowledgeCall(${order.table})">呼び出し解除</button>`:''}<button class="primary" onclick="setStatus('${order.key}','served')">提供済み</button></div>${order.callCustomerAt?'<p class="allergy">カウンター呼び出し中</p>':''}</div>`}).join('')}</div>`:'<p class="muted">調理待ちの注文はありません。</p>'}`;
}
async function login(){try{await firebaseSync.signInStaff();message=''}catch(error){message=error.message}render()}
async function setStatus(key,status){try{await firebaseSync.updateOrder(key,{status});message=''}catch(error){message='更新できませんでした。通信状態を確認してください。'}render()}
async function cancelItem(key,index){
  const order=orders.find(entry=>entry.key===key),item=order&&order.items[index];
  if(!item||remainingQty(item)<1||!confirm(`「${item.n}」を1個取消しますか？`))return;
  try{await firebaseSync.updateOrder(key,{[`items/${index}/cancelledQty`]:cancelledQty(item)+1});message=''}
  catch(error){message='取消を保存できませんでした。Firebaseルールを更新したか確認してください。'}
  render();
}
async function callCustomer(key){
  try{await firebaseSync.updateOrder(key,{callCustomerAt:Date.now()});message='お客様をカウンターへ呼び出しました。'}
  catch(error){message='呼び出しを送信できませんでした。Firebaseルールを更新したか確認してください。'}
  render();
}
async function acknowledgeCall(table){
  const pending=orders.filter(order=>order.table===table&&!order.paid&&order.callCustomerAt);
  if(!pending.length)return;
  try{await Promise.all(pending.map(order=>firebaseSync.updateOrder(order.key,{callCustomerAt:null})));message='カウンター呼び出しを解除しました。'}
  catch(error){message='呼び出しを解除できませんでした。通信状態とFirebaseルールを確認してください。'}
  render();
}
window.addEventListener('firebase-auth-changed',event=>{isStaff=event.detail.isStaff;staffEmail=event.detail.email||'';connected=false;if(!isStaff){orders=[];knownKeys=null}else setTimeout(()=>{connected=true;render()},3000);render()});
window.addEventListener('firebase-orders',event=>{
  orders=event.detail.orders;connected=true;message='';
  const keys=new Set(orders.map(order=>order.key));
  const newOrders=knownKeys?orders.filter(order=>!knownKeys.has(order.key)&&order.status==='new'):[];
  if(newOrders.length)beep();
  newOrders.forEach(scheduleOrderSpeech);
  knownKeys=keys;render();
});
window.addEventListener('firebase-sync-error',event=>{const text=event.detail?.message||'';message=/permission/i.test(text)?'権限エラー：Firebaseのルール（database.rules.json）が公開されていないか、スタッフ用アカウントでログインしていません。':(text||'データベースに接続できません。');render()});
const LIMIT_MS=20*60*1000;
function tick(){
  document.querySelectorAll('.timer').forEach(el=>{
    const left=Number(el.dataset.t)+LIMIT_MS-Date.now(),abs=Math.abs(left),text=`${String(Math.floor(abs/60000)).padStart(2,'0')}:${String(Math.floor(abs/1000)%60).padStart(2,'0')}`;
    el.textContent=left>=0?text:'+'+text;
    el.style.color=left<0?'#ff5252':left<5*60000?'#e0a030':'#5fc283';
  });
}
setInterval(tick,1000);
const baseRender=render;
render=function(){baseRender();tick()};
setInterval(()=>{if(isStaff)render()},60000);
render();
</script>
</body>
</html>
